# Minimal API gateway: one origin (:8000) that routes the Supabase sub-APIs to
# their services, like Kong does in the full stack. The app hits this internally.
events {}
http {
  server {
    listen 8000;
    # trailing slash on proxy_pass strips the /auth/v1/ prefix → GoTrue at /health,/token,/user,/admin/users
    location /auth/v1/ { proxy_pass http://auth:9999/; }
    # PostgREST serves tables at root → /rest/v1/<table>
    location /rest/v1/ { proxy_pass http://rest:3000/; }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
